; Test only: Retro Strike as a release candidate (Setup98 1.1 DisplayVersion). The final examples/retrostrike.ini
; (1.0.2) must upgrade it: numeric 1.0.1.99 < 1.0.2, while people see "1.0.2 RC2".
; Build on the Mac:   ~/Documents/86box/Shared/dev/setup98/bin/pack98 retrostrike.ini
; Build in Win98:     M:\dev\setup98\bin\pack98.exe M:\dev\setup98\examples\retrostrike.ini

[Product]
Id=RetroStrike
Name=Retro Strike
; RETROSTR.EXE has no version resource, so the version is written here (Version=from:<exe> reads it otherwise)
Version=1.0.1.99
DisplayVersion=1.0.2 RC2
Publisher=Henri Lavikainen
MainExe=RETROSTR.EXE
Folder=%ProgramFiles%\Retro Strike
Description=Retro Strike is a 5 v 5 top-down tactical shooter for Windows 98: you and four bots against five bots on Kesra, a desert town. Plant the bomb or stop it.\n\nNeeds DirectX 6 or later and a 640 x 480 display.
Readme=README.TXT
License=LICENSE
; MIT license: show it, but no "I accept" needed
LicenseAgree=0
Run=1
; the game's main window class (src/plat.cpp WNDCLASS_NAME): Setup refuses to replace files while it runs
WindowClass=Sirocco98
DataName=your settings, saved scores and logs
URL=https://github.com/HenriVSL/retro-strike

[Files]
Source=../../sandline/release/RetroStrike
File=RETROSTR.EXE
File=README.TXT
File=LICENSE
File=art\*.bmp
File=sfx\*.wav
File=data\**
; default settings: installed only if missing, never overwritten by an upgrade
Keep=retrostr.ini
; written by the game: never shipped, deleted only when the user asks (uninstall "delete settings" / /PURGE)
UserData=*.log
UserData=bench.txt
UserData=shot.bmp

[Shortcuts]
StartMenu=1
Desktop=0
Group=Retro Strike
Link=Retro Strike | RETROSTR.EXE | desc=5 v 5 tactical shooter
Link=Retro Strike (window) | RETROSTR.EXE | args=-window | desc=Retro Strike in a window
Link=Read me | README.TXT
Link=Uninstall Retro Strike | uninst.exe
DesktopLink=Retro Strike | RETROSTR.EXE | desc=5 v 5 tactical shooter

[Requires]
DirectX=6
Windows=98

[Pack]
OutFile=../out/rs-rc2-setup.exe
