; Test manifest for the generated sample (tests/gensample.cpp writes ../obj/mac/sample during `make test`).
; Covers every file kind of the generator, Keep/UserData/Generated, links, file types and requirements.
[Product]
Id=SampleGame
Name=Sample Game
Version=1.2.3
DisplayVersion=1.2.3 Test
Publisher=Setup98 tests
MainExe=GAME.EXE
Readme=README.TXT
License=LICENSE.TXT
DataName=the sample's saved games

[Files]
Source=../obj/mac/sample
File=GAME.EXE
File=README.TXT
File=LICENSE.TXT
File=art\*.bmp
File=sfx\*.wav
File=data\**
Keep=game.ini
UserData=*.sav
Generated=cache\*.tmp

[Shortcuts]
Group=Sample Game
Link=Sample Game | GAME.EXE | desc=The sample
Link=Sample Game (window) | GAME.EXE | args=-window
Link=Read me | README.TXT
Link=Uninstall | uninst.exe

[Types]
Group=Sample levels | .lvl* .lvz

[Requires]
DirectX=6
Windows=98

[Pack]
OutFile=../out/test/sample-setup.exe
