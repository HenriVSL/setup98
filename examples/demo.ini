; Setup98 manifest for the Setup98 Demo (examples/demo): self-contained, packs from this repository alone.
;   macOS / Linux:     make && bin/pack98 examples/demo.ini
;   Windows / Win98:   bin\pack98.exe examples\demo.ini
; Output: out/s98demo-1.0-setup.exe. Paths below are relative to this file's folder.

[Product]
Id=S98Demo
Name=Setup98 Demo
; read from the exe's version resource (1.0)
Version=from:s98demo.exe
Publisher=Henri Lavikainen
MainExe=s98demo.exe
Description=The Setup98 Demo is a tiny program that shows what an installer has to look after: program files, default settings that upgrades must not overwrite, data the program writes itself, and a file type.\n\nIt needs nothing but Windows 95 or later.
Readme=README.TXT
License=LICENSE.TXT
; MIT license: shown, no "I accept" needed
LicenseAgree=0
Run=1
; the demo's window class: Setup won't replace files while the demo runs
WindowClass=S98Demo
DataName=the demo's start counter
URL=https://github.com/HenriVSL/setup98

[Files]
Source=demo
File=s98demo.exe
File=README.TXT
File=LICENSE.TXT
File=data\**
; default settings: installed only if missing, never overwritten by an upgrade
Keep=s98demo.ini
; written by the demo: never shipped, deleted only when the user asks
UserData=s98demo.sav

[Shortcuts]
StartMenu=1
Desktop=0
Group=Setup98 Demo
Link=Setup98 Demo | s98demo.exe | desc=A tiny program installed by Setup98
Link=Sample greeting | s98demo.exe | args=data\hello.greet | desc=Opens data\hello.greet in the demo
Link=Read me | README.TXT
Link=Uninstall Setup98 Demo | uninst.exe

[Types]
Group=Demo greetings | .greet*
Intro=Ticked types open in the Setup98 Demo when you double-click them. Uninstall restores the previous settings.

[Pack]
OutFile=../out/s98demo-1.0-setup.exe
