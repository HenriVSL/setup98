; Setup98 manifest for Pica 1.0 (packages ../../editor/release/Pica-1.0, read-only).
; Same registry layout as Pica's own setup.exe 1.0 (Id=Pica), so this setup upgrades a Pica 1.0 install in place.

[Product]
Id=Pica
Name=Pica
Version=from:pica.exe
MainExe=pica.exe
Description=Pica is a text and hex editor for Windows 98: tabs, syntax colouring, ANSI / UTF-8 / UTF-16, find and replace with regular expressions, find in files, session restore and a hex view of the same file.
Readme=README.TXT
WindowClass=PicaFrame
DataName=your Pica settings, the saved session and the backups of unsaved changes

[Files]
Source=../../editor/release/Pica-1.0
File=pica.exe
File=README.TXT
File=LICENSE.TXT | optional
; Pica keeps its settings next to the exe when that folder is writable, else in Application Data\Pica or <windows>\Pica
UserData=pica.ini
UserData=session1.ini
UserData=session2.ini
UserData=backup\**
UserData=%AppData%\Pica\pica.ini
UserData=%AppData%\Pica\session?.ini
UserData=%AppData%\Pica\backup\**
UserData=%WinDir%\Pica\pica.ini
UserData=%WinDir%\Pica\session?.ini
UserData=%WinDir%\Pica\backup\**
; regenerated by Pica (help text, write probe): deleted by every uninstall
Generated=Pica Help.md
Generated=~pica.tst
Generated=%AppData%\Pica\Pica Help.md
Generated=%AppData%\Pica\~pica.tst
Generated=%WinDir%\Pica\Pica Help.md
Generated=%WinDir%\Pica\~pica.tst

[Shortcuts]
StartMenu=1
Desktop=0
; one shortcut directly in Programs (Programs\Pica.lnk), like Pica's own setup
Group=
Link=Pica | pica.exe | desc=Pica text and hex editor

[Types]
Group=Text files | .txt* .log* .ini* .nfo
Group=Web pages (now in your browser) | .htm .html .xml
Group=Source code | .c* .cpp* .h* .hpp .rc .asm* .py* .css .md* .mak* .diff
Group=Scripts and setup files | .bat .cmd .reg .inf .vbs .js | edit | note=Double-click still runs these; Pica becomes their Edit command.
; ProgID of the first Pica 1.0 setups: migrated on upgrade
LegacyProgId=Pica.Document

[ContextMenu]
Text=Open with &Pica
Default=1

[Pack]
OutFile=../out/pica-1.0-setup.exe
