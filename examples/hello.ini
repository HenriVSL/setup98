; Setup98 minimal manifest: the smallest useful installer (packages ../../hello/hellowin.exe, read-only).
; Copy this file into your project, change the four [Product] keys and the File= lines, and run pack98 on it.
[Product]
Id=HelloWin
Name=Hello Win
Version=1.0
MainExe=hellowin.exe

[Files]
Source=../../hello
File=hellowin.exe

[Pack]
OutFile=../out/hello-1.0-setup.exe
