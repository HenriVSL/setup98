; Setup98 minimal manifest: the smallest useful installer. It packages only the demo's exe (demo/s98demo.exe),
; so it works from this repository alone. Copy it into your project, change the four [Product] keys and the
; File= lines, and run pack98 on it. Everything else (Start menu shortcut, uninstaller, folder
; C:\Program Files\<Name>, log) comes by default.
[Product]
Id=HelloSetup98
Name=Hello Setup98
Version=1.0
MainExe=s98demo.exe

[Files]
Source=demo
File=s98demo.exe

[Pack]
OutFile=../out/hello-1.0-setup.exe
